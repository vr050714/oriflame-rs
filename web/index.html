<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oriflamme</title>
  <link rel="icon" type="image/png" href="icon.png">
  <!-- Start fetching the wasm while the JS glue loads. -->
  <link rel="preload" href="oriflamme-rs_bg.wasm" as="fetch" type="application/wasm" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a382e; }
    /* Bevy sizes the canvas to this element (`fit_canvas_to_parent`). */
    #game { position: fixed; inset: 0; }
    #bevy { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #e8dcc0; font: 20px/1.4 Georgia, serif; text-align: center; padding: 16px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
  <div id="status">Loading Oriflamme…</div>
  <script type="module">
    import init from "./oriflamme-rs.js";

    const status = document.getElementById("status");
    const canvas = document.getElementById("bevy");
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    // Bevy's first frame paints the canvas; hide the loading text then.
    new ResizeObserver((_, observer) => {
      if (canvas.width > 0) { status.remove(); observer.disconnect(); }
    }).observe(canvas);

    try {
      await init();
    } catch (error) {
      // winit leaves the start-up function by throwing this on purpose;
      // the game keeps running from the browser's event loop.
      if (!String(error).includes("Using exceptions for control flow")) {
        status.textContent = "The game could not start: " + error;
        throw error;
      }
    }
  </script>
</body>
</html>
